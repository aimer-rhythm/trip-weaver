# 宿主机 Nginx 站点配置参考 —— 放入 /etc/nginx/conf.d/tripweaver.conf 或 sites-available
# 场景：宿主机已有 Nginx（含证书体系），compose 栈只暴露 127.0.0.1:3001
# 替换 <域名> 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name <域名>;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲与压缩，生成进度事件实时到达浏览器
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }
}

# HTTPS：复用宿主机现有证书管理（certbot / acme.sh / 宝塔等），
# 证书就绪后在其 443 server 块中使用与上方相同的 location 配置，
# 并加 proxy_set_header X-Forwarded-Proto https;
