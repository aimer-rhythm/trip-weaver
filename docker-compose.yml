# ===== Docker Compose 部署（双轨模式 + 宿主机反代） =====
# 模式 1（推荐）：默认拉取 GitHub Container Registry 预构建镜像
#   docker compose up -d
# 模式 2（兜底）：镜像不可用时本地构建
#   TRIPWEAVER_IMAGE='' docker compose up --build -d
# 也可显式指定镜像版本：TRIPWEAVER_IMAGE=ghcr.io/aimer-rhythm/trip-weaver:v1.2.3 docker compose up -d
#
# 反代约定：app 只绑 127.0.0.1:${APP_PORT:-3001}，由宿主机 Nginx 转发（复用现有证书体系）。
# 宿主机 Nginx 站点配置参考 nginx.host.conf（含 SSE 关键参数）。
# 独立内置反代（容器化 nginx，自动占 80/443）的场景用 docker-compose.release.yml。
services:
  app:
    image: ${TRIPWEAVER_IMAGE:-ghcr.io/aimer-rhythm/trip-weaver:latest}
    pull_policy: always
    build:
      context: .
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/tripweaver
    # 绑定 127.0.0.1：由宿主机 Nginx（或其他前置反代）转发，容器不直接对公网暴露
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      - db

  db:
    # pgvector 镜像：向量扩展随库可用（CREATE EXTENSION vector 在启动迁移中幂等执行）
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=tripweaver
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  pg_data:
