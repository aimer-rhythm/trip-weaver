# ===== Docker Compose 部署（双轨模式） =====
# 模式 1（推荐）：默认拉取 GitHub Container Registry 预构建镜像
#   docker compose up -d
# 模式 2（兜底）：镜像不可用时本地构建
#   TRIPWEAVER_IMAGE='' docker compose up --build -d
# 也可显式指定镜像版本：TRIPWEAVER_IMAGE=ghcr.io/aimer-rhythm/trip-weaver:v1.2.3 docker compose up -d
services:
  app:
    image: ${TRIPWEAVER_IMAGE:-ghcr.io/aimer-rhythm/trip-weaver:latest}
    pull_policy: always
    build:
      context: .
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/tripweaver
    expose:
      - "3001"
    depends_on:
      - db

  db:
    # pgvector 镜像：向量扩展随库可用（CREATE EXTENSION vector 在启动迁移中幂等执行）
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=tripweaver
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-_}
    volumes:
      # nginx:alpine 官方模板机制：启动时 envsubst 替换 ${SITE_DOMAIN}
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - app

volumes:
  nginx_certs:
  pg_data:
